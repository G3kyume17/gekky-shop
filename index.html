<!DOCTYPE html>
<html lang="en" class="dark h-full bg-[#050507] text-zinc-100 selection:bg-red-600 selection:text-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GEKKY SHOP // Y2K VAMP VAULT</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { cyber: { bg: '#050507', surface: '#0b0c10', card: '#101218', cardHover: '#161922', border: 'rgba(255, 255, 255, 0.12)', chrome: '#c0c0c0', accentRed: '#ff003c', accentPurple: '#a855f7' } }, fontFamily: { display: ['Syne', 'Orbitron', 'sans-serif'], sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] } } } }
  </script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@600;800;900&family=Syne:wght@700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #050507; }
    ::-webkit-scrollbar-thumb { background: #1e2230; border: 1px solid rgba(255, 0, 60, 0.3); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #ff003c; box-shadow: 0 0 10px #ff003c; }
    
    .y2k-text { 
      background: linear-gradient(135deg, #ffffff 20%, #ff003c 70%, #550013 100%); 
      -webkit-background-clip: text; 
      background-clip: text; 
      -webkit-text-fill-color: transparent; 
      filter: drop-shadow(0px 0px 15px rgba(255, 0, 60, 0.6)); 
    }
    
    .holographic-card { 
      background: rgba(12, 12, 16, 0.9); 
      backdrop-filter: blur(20px); 
      -webkit-backdrop-filter: blur(20px); 
      border: 1px solid rgba(255, 0, 60, 0.25); 
      box-shadow: inset 0 0 20px rgba(255, 0, 60, 0.05), 0 20px 40px -15px rgba(0, 0, 0, 0.9); 
    }
    .holographic-card:hover { 
      border-color: rgba(255, 0, 60, 0.8); 
      box-shadow: inset 0 0 25px rgba(255, 0, 60, 0.2), 0 0 35px rgba(255, 0, 60, 0.4); 
    }
    .scanline-overlay { background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0, 0, 0, 0.3) 50%, rgba(0, 0, 0, 0.3)); background-size: 100% 4px; pointer-events: none; }
    .cyber-grid { background-size: 50px 50px; background-image: linear-gradient(to right, rgba(255, 0, 60, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 0, 60, 0.03) 1px, transparent 1px); }
  </style>
</head>
<body class="h-full font-sans antialiased bg-[#050507] text-zinc-100 selection:bg-red-600 selection:text-white relative overflow-x-hidden">
  
  <div class="fixed inset-0 cyber-grid pointer-events-none opacity-80 z-0"></div>
  <div class="fixed inset-0 scanline-overlay pointer-events-none opacity-30 z-0"></div>

  <div id="root" class="relative z-10 min-h-full flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    const SUPABASE_URL = 'https://wdnptsavscaarxnzznjb.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_HAKxLOwxotoHp3uRaXM43g_0SQxDEDO';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const INITIAL_SITE_SETTINGS = {
      siteName: "GEKKY SHOP",
      heroTitle: "THE FUTURE OF DIGITAL GOODS.",
      heroSubtitle: "Curated Cyber Y2K source code, production toolkits, high-end 3D design packages, and developer OS templates.",
      announcementText: "† SEΛSON 04 VΛMPS LIVE // INSTANT VΛULT DELIVERIES ENABLED †",
      currencySymbol: "$",
      bioText: "GEKKY SHOP is an independent underground cyber storefront crafted for digital creators, engineers, and visual artists.",
      cryptoAddress: "TYvK...YOUR_BINANCE_WALLET_ADDRESS",
      gcashNumber: "0912-345-6789",
      gotymeAccount: "0123-4567-8910"
    };

    const INITIAL_CATEGORIES = [
      { id: "cat-1", name: "DIGITAL PRODUCTS" },
      { id: "cat-2", name: "SOFTWARE" },
      { id: "cat-3", name: "DESIGN" },
      { id: "cat-4", name: "SERVICES" }
    ];

    const FALLBACK_PRODUCTS = [
      { id: "prod-1", name: "Real", category_id: "cat-2", price: 10, compare_price: 20, stock: 150, product_type: "EXECUTOR", active: true, featured: true, image_url: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&auto=format&fit=crop&q=80", description: "Experience a premium Roblox scripting experience with a reliable and consistent tool...", digital_file_name: "real_executor_v1.zip" },
      { id: "prod-2", name: "Aether VAMP SaaS Boilerplate", category_id: "cat-1", price: 49, compare_price: 99, stock: 80, product_type: "Full-Stack Source Code", active: true, featured: true, image_url: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=800&auto=format&fit=crop&q=80", description: "Production Next.js 14 App Router starter integrated with Supabase Auth.", digital_file_name: "aether_os_v2_core.zip" }
    ];

    function App() {
      const [settings, setSettings] = useState(INITIAL_SITE_SETTINGS);
      const [products, setProducts] = useState(FALLBACK_PRODUCTS);
      const [categories, setCategories] = useState(INITIAL_CATEGORIES);
      const [orders, setOrders] = useState([]);
      const [user, setUser] = useState({ loggedIn: false, email: "visitor@gekky.shop", name: "Guest", role: "visitor" });
      const [isAdminView, setIsAdminView] = useState(false);
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [activePage, setActivePage] = useState("home");
      const [selectedProductId, setSelectedProductId] = useState("prod-1");
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [cart, setCart] = useState([]);
      const [toasts, setToasts] = useState([]);

      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => handleSession(session));
        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => handleSession(session));
        fetchCMSettings();
        fetchProducts();
        return () => subscription.unsubscribe();
      }, []);

      // Automatically update the browser tab title when siteName changes
      useEffect(() => {
        if (settings.siteName) {
          document.title = `${settings.siteName} // Y2K VAMP VAULT`;
        }
      }, [settings.siteName]);

      const fetchCMSettings = async () => {
        const { data } = await supabase.from('site_settings').select('*').eq('id', 1).single();
        if (data) {
          setSettings(prev => ({
            ...prev,
            siteName: data.site_name || prev.siteName,
            heroTitle: data.hero_title || prev.heroTitle,
            heroSubtitle: data.hero_subtitle || prev.heroSubtitle,
            announcementText: data.announcement_text || prev.announcementText,
            bioText: data.bio_text || prev.bioText,
            cryptoAddress: data.crypto_address || prev.cryptoAddress,
            gcashNumber: data.gcash_number || prev.gcashNumber,
            gotymeAccount: data.gotyme_account || prev.gotymeAccount
          }));
        }
      };

      const fetchProducts = async () => {
        const { data } = await supabase.from('products').select('*');
        if (data && data.length > 0) setProducts(data);
      };

      const handleSession = async (currentSession) => {
        if (currentSession) {
          const { data: profile } = await supabase.from('profiles').select('*').eq('id', currentSession.user.id).single();
          if (profile) {
            setUser({ loggedIn: true, email: profile.email, name: profile.email.split('@')[0], role: profile.role });
            if (profile.role === 'admin') setIsAdminView(true);
          } else {
            setUser({ loggedIn: true, email: currentSession.user.email, name: currentSession.user.email.split('@')[0], role: "member" });
          }
        } else {
          setUser({ loggedIn: false, email: "visitor@gekky.shop", name: "Guest", role: "visitor" });
          setIsAdminView(false);
          if (activePage === "admin") setActivePage("home");
        }
      };

      const handleLogout = async () => {
        await supabase.auth.signOut();
        addToast("Logged out successfully.");
      };

      const addToast = useCallback((message, type = "success") => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3500);
      }, []);

      const cartSubtotal = useMemo(() => cart.reduce((acc, item) => acc + (item.product.price * item.quantity), 0), [cart]);
      const cartCount = useMemo(() => cart.reduce((acc, item) => acc + item.quantity, 0), [cart]);

      const addToCart = (product, qty = 1) => {
        if (product.stock <= 0) return addToast("Item is out of stock.", "error");
        setCart(prev => {
          const existing = prev.find(item => item.product.id === product.id);
          if (existing) return prev.map(item => item.product.id === product.id ? { ...item, quantity: existing.quantity + qty } : item);
          return [...prev, { product, quantity: qty }];
        });
        addToast(`Added "${product.name}" to cart!`);
      };

      const buyNow = (product) => {
        addToCart(product, 1);
        setActivePage("checkout");
      };

      const updateCartQty = (productId, qty) => {
        if (qty <= 0) return setCart(prev => prev.filter(item => item.product.id !== productId));
        setCart(prev => prev.map(item => item.product.id === productId ? { ...item, quantity: qty } : item));
      };

      const removeFromCart = (productId) => {
        setCart(prev => prev.filter(item => item.product.id !== productId));
        addToast("Item removed from cart.", "info");
      };

      const navigateToProduct = (id) => {
        setSelectedProductId(id);
        setActivePage("product-detail");
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#050507] text-zinc-100 font-sans selection:bg-red-600 selection:text-white">
          
          <div className="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none">
            {toasts.map(t => (
              <div key={t.id} className={`pointer-events-auto p-4 rounded-xl border holographic-card shadow-[0_0_20px_rgba(255,0,60,0.3)] flex items-center gap-3 ${t.type === 'error' ? 'border-red-500/60 text-red-200' : 'border-red-500/60 text-red-100'}`}>
                <i className={`fas ${t.type === 'error' ? 'fa-triangle-exclamation text-red-500' : 'fa-skull text-red-500'} text-lg`}></i>
                <span className="text-xs font-semibold tracking-wide font-mono">{t.message}</span>
              </div>
            ))}
          </div>

          <div className="bg-zinc-950/95 border-b border-red-600/30 px-4 py-1.5 text-[11px] font-mono flex justify-between items-center text-zinc-400">
            <div className="flex items-center gap-2">
              <span className={`inline-block w-2 h-2 rounded-full shadow-[0_0_10px_#ff003c] ${user.role === 'admin' ? 'bg-red-500 animate-ping' : 'bg-zinc-600'}`}></span>
              <span>USER ROLE: <strong className="text-red-400">{user.role.toUpperCase()}</strong> ({user.email})</span>
            </div>
            {user.loggedIn && (
              <button onClick={handleLogout} className="text-zinc-400 hover:text-red-400 transition">Sign Out</button>
            )}
          </div>

          {settings.announcementText && (
            <div className="bg-gradient-to-r from-red-950/80 via-zinc-900 to-black border-b border-red-600/40 py-2 px-4 text-center text-[11px] font-mono tracking-widest text-red-400 uppercase overflow-hidden shadow-[inset_0_0_20px_rgba(255,0,60,0.15)]">
              <span className="inline-block animate-pulse">{settings.announcementText}</span>
            </div>
          )}

          <header className="sticky top-0 z-40 bg-[#050507]/90 backdrop-blur-xl border-b border-white/10 shadow-[0_4px_30px_rgba(0,0,0,0.8)]">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
              <div className="flex items-center gap-8">
                <button onClick={() => setActivePage("home")} className="flex items-center gap-3 group text-left">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-red-600 via-black to-zinc-900 p-[1.5px] shadow-[0_0_25px_rgba(255,0,60,0.6)] group-hover:scale-105 transition-transform">
                    <div className="w-full h-full bg-black rounded-[10px] flex items-center justify-center font-display font-black text-red-500 text-lg tracking-tighter">†</div>
                  </div>
                  <div>
                    <span className="font-display font-black text-xl tracking-widest y2k-text uppercase">{settings.siteName}</span>
                  </div>
                </button>
                <nav className="hidden md:flex items-center gap-6 text-xs font-mono font-bold tracking-wider text-zinc-400 uppercase">
                  <button onClick={() => setActivePage("home")} className={`hover:text-red-500 transition ${activePage === 'home' ? 'text-red-400 border-b-2 border-red-600 pb-1 shadow-[0_10px_10px_-5px_rgba(255,0,60,0.4)]' : ''}`}>HOME</button>
                  <button onClick={() => setActivePage("store")} className={`hover:text-red-500 transition ${activePage === 'store' ? 'text-red-400 border-b-2 border-red-600 pb-1' : ''}`}>STORE</button>
                  <button onClick={() => setActivePage("about")} className={`hover:text-red-500 transition ${activePage === 'about' ? 'text-red-400 border-b-2 border-red-600 pb-1' : ''}`}>ABOUT</button>
                </nav>
              </div>

              <div className="flex items-center gap-3">
                <button onClick={() => setIsCartOpen(true)} className="relative p-2.5 rounded-xl holographic-card text-zinc-300 hover:text-red-500 transition group">
                  <i className="fas fa-shopping-bag text-sm group-hover:scale-110 transition-transform"></i>
                  {cartCount > 0 && <span className="absolute -top-1 -right-1 bg-red-600 text-white text-[10px] font-mono font-black w-4 h-4 rounded-full flex items-center justify-center shadow-[0_0_10px_#ff003c]">{cartCount}</span>}
                </button>
                <button onClick={() => user.loggedIn ? setActivePage("account") : setIsAuthModalOpen(true)} className={`p-2.5 rounded-xl holographic-card transition ${activePage === 'account' ? 'border-red-600 text-red-400 shadow-[0_0_15px_rgba(255,0,60,0.4)]' : 'text-zinc-300 hover:text-red-500'}`}>
                  <i className="fas fa-user-circle text-base"></i>
                </button>
                {user.role === 'admin' && (
                  <button onClick={() => { setIsAdminView(true); setActivePage("admin"); }} className={`hidden sm:flex items-center gap-1.5 px-3.5 py-2 rounded-xl border text-[11px] font-mono font-bold transition shadow-[0_0_15px_rgba(255,0,60,0.3)] ${activePage === 'admin' ? 'border-red-600 bg-red-950/40 text-red-400' : 'border-white/20 text-zinc-300 hover:border-red-600'}`}>
                    <i className="fas fa-shield-halved text-red-500 animate-pulse"></i> ADMIN
                  </button>
                )}
              </div>
            </div>
          </header>

          <main className="flex-1">
            {activePage === "home" && <HomePage settings={settings} products={products} categories={categories} onSelectProduct={navigateToProduct} onBrowseStore={() => setActivePage("store")} onAddToCart={addToCart} onBuyNow={buyNow} />}
            {activePage === "store" && <StorePage settings={settings} products={products} onSelectProduct={navigateToProduct} onAddToCart={addToCart} onBuyNow={buyNow} />}
            {activePage === "product-detail" && <ProductDetailPage settings={settings} productId={selectedProductId} products={products} onAddToCart={addToCart} onBuyNow={buyNow} />}
            {activePage === "checkout" && <CheckoutPage settings={settings} cart={cart} cartSubtotal={cartSubtotal} user={user} onOrderComplete={(newOrder) => { setOrders(prev => [newOrder, ...prev]); setCart([]); setActivePage("account"); addToast("Order submitted for payment verification! Manual key delivery pending.", "success"); }} />}
            {activePage === "account" && <AccountPage user={user} orders={orders} />}
            {activePage === "about" && <AboutPage settings={settings} />}

            {activePage === "admin" && (
              user.role === 'admin' ? (
                <AdminDashboard settings={settings} setSettings={setSettings} products={products} fetchProducts={fetchProducts} categories={categories} orders={orders} addToast={addToast} fetchCMSettings={fetchCMSettings} />
              ) : (
                <div className="max-w-4xl mx-auto px-4 py-32 text-center space-y-4">
                  <i className="fas fa-skull text-6xl text-red-600 mb-4 animate-bounce"></i>
                  <h1 className="text-4xl font-display font-extrabold text-white y2k-text">ACCESS DENIED</h1>
                  <p className="text-zinc-400 font-mono text-sm">Your clearance level ({user.role.toUpperCase()}) cannot bypass VAMP protocols.</p>
                  <button onClick={() => setActivePage("store")} className="mt-6 px-8 py-3 bg-red-600 hover:bg-red-500 text-white font-bold text-xs rounded-xl shadow-[0_0_25px_rgba(255,0,60,0.5)] transition">RETURN TO STORE</button>
                </div>
              )
            )}
          </main>

          {isCartOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden bg-black/80 backdrop-blur-md">
              <div className="absolute inset-0" onClick={() => setIsCartOpen(false)}></div>
              <div className="absolute inset-y-0 right-0 max-w-full flex pl-10">
                <div className="w-screen max-w-md bg-[#0b0c10] border-l border-red-600/40 text-white shadow-[-10px_0_40px_rgba(255,0,60,0.2)] flex flex-col">
                  <div className="p-6 border-b border-white/10 flex items-center justify-between bg-zinc-950">
                    <h3 className="font-display font-bold text-sm tracking-widest text-white flex items-center gap-2"><i className="fas fa-shopping-bag text-red-500"></i> SHOPPING CART ({cartCount})</h3>
                    <button onClick={() => setIsCartOpen(false)} className="text-zinc-400 hover:text-white"><i className="fas fa-xmark text-lg"></i></button>
                  </div>
                  <div className="flex-1 overflow-y-auto p-6 space-y-4">
                    {cart.map(item => (
                      <div key={item.product.id} className="flex gap-4 p-3 holographic-card rounded-xl border border-red-600/30">
                        <img src={item.product.image_url} alt={item.product.name} className="w-16 h-16 rounded-lg object-cover border border-white/10" />
                        <div className="flex-1 min-w-0">
                          <h4 className="font-bold text-xs text-white truncate">{item.product.name}</h4>
                          <p className="font-mono text-xs text-red-400 font-bold mt-1">{settings.currencySymbol}{item.product.price}</p>
                          <div className="flex items-center gap-3 mt-2">
                            <div className="flex items-center border border-white/10 rounded-lg bg-zinc-900 font-mono text-xs overflow-hidden">
                              <button onClick={() => updateCartQty(item.product.id, item.quantity - 1)} className="px-2.5 py-1 text-zinc-400 hover:text-white hover:bg-zinc-800">-</button>
                              <span className="px-3 font-bold text-red-400">{item.quantity}</span>
                              <button onClick={() => updateCartQty(item.product.id, item.quantity + 1)} className="px-2.5 py-1 text-zinc-400 hover:text-white hover:bg-zinc-800">+</button>
                            </div>
                            <button onClick={() => removeFromCart(item.product.id)} className="text-[11px] font-mono text-red-500 hover:underline">Remove</button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                  {cart.length > 0 && (
                    <div className="p-6 border-t border-red-600/30 bg-zinc-950 space-y-4 font-mono">
                      <div className="flex justify-between text-sm font-bold text-white"><span>Total Due</span><span className="text-red-500 font-black text-base">{settings.currencySymbol}{cartSubtotal}</span></div>
                      <button onClick={() => { setIsCartOpen(false); setActivePage("checkout"); }} className="w-full py-4 bg-gradient-to-r from-red-600 to-black hover:from-red-500 hover:to-zinc-900 text-white font-display font-black text-xs tracking-widest rounded-xl transition shadow-[0_0_25px_rgba(255,0,60,0.5)] text-center">PROCEED TO CHECKOUT</button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {isAuthModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-lg flex items-center justify-center p-4">
              <div className="holographic-card rounded-3xl w-full max-w-md p-8 space-y-6 relative border border-red-600/50 shadow-[0_0_50px_rgba(255,0,60,0.3)]">
                <button onClick={() => setIsAuthModalOpen(false)} className="absolute top-5 right-5 text-zinc-400 hover:text-white"><i className="fas fa-times text-lg"></i></button>
                <div>
                  <h3 className="font-display font-extrabold text-xl text-white tracking-widest y2k-text">VAMP AUTHENTICATION</h3>
                  <p className="text-xs text-zinc-400 font-mono mt-1">Sign in or register to access the underground vault.</p>
                </div>

                <form onSubmit={async (e) => { 
                  e.preventDefault(); 
                  const email = e.target.authEmail.value;
                  const password = e.target.authPassword.value;
                  const isSignUp = e.nativeEvent.submitter.name === 'signup';
                  let error;

                  if (isSignUp) {
                    const res = await supabase.auth.signUp({ email, password });
                    error = res.error;
                    if (!error) addToast("Registration complete! Vault unlocked.", "success");
                  } else {
                    const res = await supabase.auth.signInWithPassword({ email, password });
                    error = res.error;
                    if (!error) addToast("Authentication verified.", "success");
                  }

                  if (error) addToast(error.message, "error");
                  else setIsAuthModalOpen(false);
                }} className="space-y-4 font-mono text-xs">
                  <div>
                    <label className="text-zinc-400 block mb-1.5 font-bold">Email Address</label>
                    <input id="authEmail" type="email" required className="w-full bg-zinc-950 border border-white/15 rounded-xl p-3.5 text-white focus:outline-none focus:border-red-600 focus:shadow-[0_0_15px_rgba(255,0,60,0.4)] transition" placeholder="vamp@gekky.shop" />
                  </div>
                  <div>
                    <label className="text-zinc-400 block mb-1.5 font-bold">Passcode</label>
                    <input id="authPassword" type="password" required className="w-full bg-zinc-950 border border-white/15 rounded-xl p-3.5 text-white focus:outline-none focus:border-red-600 focus:shadow-[0_0_15px_rgba(255,0,60,0.4)] transition" placeholder="••••••••" />
                  </div>
                  <div className="flex gap-3 pt-2">
                    <button type="submit" name="signin" className="flex-1 py-3.5 bg-red-600 hover:bg-red-500 text-white font-extrabold rounded-xl transition shadow-[0_0_20px_rgba(255,0,60,0.5)]">SIGN IN</button>
                    <button type="submit" name="signup" className="flex-1 py-3.5 bg-zinc-900 hover:bg-zinc-800 text-white font-extrabold rounded-xl transition border border-white/20">REGISTER</button>
                  </div>
                </form>
              </div>
            </div>
          )}

    function AdminDashboard({ settings, setSettings, products, fetchProducts, categories, orders, addToast, fetchCMSettings }) {
      const [adminTab, setAdminTab] = useState("products");
      const [isProductModalOpen, setIsProductModalOpen] = useState(false);
      const [editingProduct, setEditingProduct] = useState(null);

      // CMS State
      const [siteName, setSiteName] = useState(settings.siteName);
      const [heroTitle, setHeroTitle] = useState(settings.heroTitle);
      const [heroSubtitle, setHeroSubtitle] = useState(settings.heroSubtitle);
      const [announcementText, setAnnouncementText] = useState(settings.announcementText);
      const [bioText, setBioText] = useState(settings.bioText);
      const [isSavingCMS, setIsSavingCMS] = useState(false);

      // Payment Settings State
      const [cryptoAddress, setCryptoAddress] = useState(settings.cryptoAddress);
      const [gcashNumber, setGcashNumber] = useState(settings.gcashNumber);
      const [gotymeAccount, setGotymeAccount] = useState(settings.gotymeAccount);
      const [isSavingPayment, setIsSavingPayment] = useState(false);

      const handleSaveCMS = async (e) => {
        e.preventDefault();
        setIsSavingCMS(true);
        // Safely upsert including payment values so they aren't cleared out
        const { error } = await supabase.from('site_settings').upsert({
          id: 1, 
          site_name: siteName, 
          hero_title: heroTitle, 
          hero_subtitle: heroSubtitle, 
          announcement_text: announcementText, 
          bio_text: bioText,
          crypto_address: settings.cryptoAddress,
          gcash_number: settings.gcashNumber,
          gotyme_account: settings.gotymeAccount
        });
        if (error) addToast("Error: " + error.message, "error");
        else { addToast("CMS settings saved successfully!"); fetchCMSettings(); }
        setIsSavingCMS(false);
      };

      const handleSavePayment = async (e) => {
        e.preventDefault();
        setIsSavingPayment(true);
        // Safely upsert including CMS values so they aren't cleared out
        const { error } = await supabase.from('site_settings').upsert({
          id: 1, 
          site_name: settings.siteName, 
          hero_title: settings.heroTitle, 
          hero_subtitle: settings.heroSubtitle, 
          announcement_text: settings.announcementText, 
          bio_text: settings.bioText,
          crypto_address: cryptoAddress,
          gcash_number: gcashNumber,
          gotyme_account: gotymeAccount
        });
        if (error) addToast("Error: " + error.message, "error");
        else { addToast("Payment settings updated successfully!"); fetchCMSettings(); }
        setIsSavingPayment(false);
      };

      const handleSaveProduct = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const prodId = editingProduct ? editingProduct.id : `prod-${Date.now()}`;

        const payload = {
          id: prodId,
          name: formData.get("name"),
          category_id: formData.get("category_id"),
          price: Number(formData.get("price")),
          compare_price: Number(formData.get("compare_price")),
          stock: Number(formData.get("stock")),
          product_type: formData.get("product_type"),
          active: formData.get("active") === "on",
          featured: formData.get("featured") === "on",
          image_url: formData.get("image_url"),
          description: formData.get("description"),
          digital_file_name: formData.get("digital_file_name") || "download.zip"
        };

        const { error } = await supabase.from('products').upsert(payload);
        if (error) addToast("Error saving product: " + error.message, "error");
        else {
          addToast(editingProduct ? "Product updated!" : "Product created!");
          fetchProducts();
          setIsProductModalOpen(false);
          setEditingProduct(null);
        }
      };

      const handleDeleteProduct = async (id) => {
        if (window.confirm("Are you sure you want to delete this product?")) {
          const { error } = await supabase.from('products').delete().eq('id', id);
          if (error) addToast("Error deleting: " + error.message, "error");
          else { addToast("Product removed."); fetchProducts(); }
        }
      };

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-8 font-mono">
          <div className="flex justify-between items-center border-b border-red-600/40 pb-6">
            <h1 className="text-2xl font-display font-extrabold text-white y2k-text flex items-center gap-3">
              <i className="fas fa-shield-halved text-red-500"></i> ADMIN CONTROL PANEL
            </h1>
            <button onClick={() => { setEditingProduct(null); setIsProductModalOpen(true); }} className="px-5 py-2.5 bg-red-600 hover:bg-red-500 text-white font-bold text-xs rounded-xl shadow-[0_0_20px_rgba(255,0,60,0.5)] transition flex items-center gap-2">
              <i className="fas fa-plus"></i> ADD PRODUCT
            </button>
          </div>

          <div className="flex flex-wrap gap-3 border-b border-white/10 pb-3">
            <button onClick={() => setAdminTab("products")} className={`px-5 py-2 rounded-xl text-xs font-bold uppercase transition ${adminTab === 'products' ? 'bg-red-600 text-white shadow-[0_0_15px_rgba(255,0,60,0.5)]' : 'holographic-card text-zinc-400 hover:text-white'}`}>Products ({products.length})</button>
            <button onClick={() => setAdminTab("cms")} className={`px-5 py-2 rounded-xl text-xs font-bold uppercase transition ${adminTab === 'cms' ? 'bg-red-600 text-white shadow-[0_0_15px_rgba(255,0,60,0.5)]' : 'holographic-card text-zinc-400 hover:text-white'}`}>CMS Settings</button>
            <button onClick={() => setAdminTab("payment")} className={`px-5 py-2 rounded-xl text-xs font-bold uppercase transition ${adminTab === 'payment' ? 'bg-red-600 text-white shadow-[0_0_15px_rgba(255,0,60,0.5)]' : 'holographic-card text-zinc-400 hover:text-white'}`}>Payment Accounts</button>
          </div>

          {adminTab === "products" && (
            <div className="overflow-x-auto holographic-card border border-red-600/30 rounded-3xl shadow-[0_0_30px_rgba(255,0,60,0.15)]">
              <table className="w-full text-left text-xs text-zinc-300">
                <thead className="bg-zinc-950 text-red-500 uppercase text-[10px] font-bold border-b border-white/10">
                  <tr>
                    <th className="p-4">PRODUCT</th>
                    <th className="p-4">PRICE</th>
                    <th className="p-4">STOCK</th>
                    <th className="p-4">ACTIONS</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-white/5">
                  {products.map(p => (
                    <tr key={p.id} className="hover:bg-red-600/5 transition">
                      <td className="p-4 font-bold text-white flex items-center gap-3.5">
                        <img src={p.image_url} alt="" className="w-10 h-10 rounded-xl object-cover border border-white/15 shadow" />
                        {p.name}
                      </td>
                      <td className="p-4 font-bold text-red-400">{settings.currencySymbol}{p.price}</td>
                      <td className="p-4">{p.stock}</td>
                      <td className="p-4 space-x-3">
                        <button onClick={() => { setEditingProduct(p); setIsProductModalOpen(true); }} className="text-red-400 hover:underline">Edit</button>
                        <button onClick={() => handleDeleteProduct(p.id)} className="text-red-500 hover:underline">Delete</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {adminTab === "cms" && (
            <form onSubmit={handleSaveCMS} className="p-8 holographic-card rounded-3xl border border-red-600/40 space-y-5 max-w-2xl text-xs shadow-[0_0_30px_rgba(255,0,60,0.15)]">
              <h3 className="font-bold text-white text-sm tracking-wider text-red-400 border-b border-white/10 pb-2">STOREFRONT GENERAL CMS SETTINGS</h3>
              <div><label className="text-zinc-400 block mb-1.5 font-bold">Site Title</label><input type="text" value={siteName} onChange={(e) => setSiteName(e.target.value)} className="w-full bg-zinc-950 border border-white/15 rounded-xl p-3 text-white focus:outline-none focus:border-red-600" required /></div>
              <div><label className="text-zinc-400 block mb-1.5 font-bold">Hero Title</label><input type="text" value={heroTitle} onChange={(e) => setHeroTitle(e.target.value)} className="w-full bg-zinc-950 border border-white/15 rounded-xl p-3 text-white focus:outline-none focus:border-red-600" required /></div>
              <div><label className="text-zinc-400 block mb-1.5 font-bold">Hero Subtitle</label><textarea value={heroSubtitle} onChange={(e) => setHeroSubtitle(e.target.value)} className="w-full bg-zinc-950 border border-white/15 rounded-xl p-3 text-white h-20 focus:outline-none focus:border-red-600" required></textarea></div>
              <div><label className="text-zinc-400 block mb-1.5 font-bold">Announcement Text</label><input type="text" value={announcementText} onChange={(e) => setAnnouncementText(e.target.value)} className="w-full bg-zinc-950 border border-white/15 rounded-xl p-3 text-white focus:outline-none focus:border-red-600" required /></div>
              <div><label className="text-zinc-400 block mb-1.5 font-bold">Brand Bio Text</label><textarea value={bioText} onChange={(e) => setBioText(e.target.value)} className="w-full bg-zinc-950 border border-white/15 rounded-xl p-3 text-white h-24 focus:outline-none focus:border-red-600" required></textarea></div>
              <button type="submit" disabled={isSavingCMS} className="w-full py-4 bg-red-600 hover:bg-red-500 text-white font-extrabold rounded-xl shadow-[0_0_20px_rgba(255,0,60,0.5)] transition">{isSavingCMS ? "SAVING..." : "SAVE CMS CHANGES"}</button>
            </form>
          )}

          {adminTab === "payment" && (
            <form onSubmit={handleSavePayment} className="p-8 holographic-card rounded-3xl border border-red-600/40 space-y-5 max-w-2xl text-xs shadow-[0_0_30px_rgba(255,0,60,0.15)]">
              <h3 className="font-bold text-white text-sm tracking-wider text-red-400 border-b border-white/10 pb-2">SECURE PAYMENT ENDPOINTS (ADMIN ONLY)</h3>
              <div>
                <label className="text-zinc-400 block mb-1.5 font-bold">Binance / Crypto Wallet Address (USDT TRC20 / LTC)</label>
                <input type="text" value={cryptoAddress} onChange={(e) => setCryptoAddress(e.target.value)} className="w-full bg-zinc-950 border border-white/15 rounded-xl p-3 text-white font-mono focus:outline-none focus:border-red-600" required />
              </div>
              <div>
                <label className="text-zinc-400 block mb-1.5 font-bold">GCash Number</label>
                <input type="text" value={gcashNumber} onChange={(e) => setGcashNumber(e.target.value)} className="w-full bg-zinc-950 border border-white/15 rounded-xl p-3 text-white font-mono focus:outline-none focus:border-red-600" required />
              </div>
              <div>
                <label className="text-zinc-400 block mb-1.5 font-bold">GoTyme Bank Account Number</label>
                <input type="text" value={gotymeAccount} onChange={(e) => setGotymeAccount(e.target.value)} className="w-full bg-zinc-950 border border-white/15 rounded-xl p-3 text-white font-mono focus:outline-none focus:border-red-600" required />
              </div>
              <button type="submit" disabled={isSavingPayment} className="w-full py-4 bg-red-600 hover:bg-red-500 text-white font-extrabold rounded-xl shadow-[0_0_20px_rgba(255,0,60,0.5)] transition">{isSavingPayment ? "SAVING..." : "SAVE PAYMENT ACCOUNTS"}</button>
            </form>
          )}

          {isProductModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-lg flex items-center justify-center p-4">
              <div className="holographic-card rounded-3xl w-full max-w-2xl p-8 space-y-5 max-h-[90vh] overflow-y-auto border border-red-600/50 shadow-[0_0_50px_rgba(255,0,60,0.3)]">
                <div className="flex justify-between items-center border-b border-white/15 pb-4">
                  <h3 className="font-bold text-white text-sm tracking-wider">{editingProduct ? "EDIT PRODUCT" : "CREATE PRODUCT"}</h3>
                  <button onClick={() => setIsProductModalOpen(false)} className="text-zinc-400 hover:text-white"><i className="fas fa-xmark text-lg"></i></button>
                </div>
                <form onSubmit={handleSaveProduct} className="space-y-4 text-xs">
                  <div><label className="text-zinc-400 block mb-1.5 font-bold">Product Name</label><input type="text" name="name" defaultValue={editingProduct?.name || ""} className="w-full bg-zinc-950 border border-white/15 rounded-xl p-3 text-white focus:outline-none focus:border-red-600" required /></div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="text-zinc-400 block mb-1.5 font-bold">Category</label>
                      <select name="category_id" defaultValue={editingProduct?.category_id || categories[0]?.id} className="w-full bg-zinc-950 border border-white/15 rounded-xl p-3 text-white focus:outline-none focus:border-red-600">
                        {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                      </select>
                    </div>
                    <div><label className="text-zinc-400 block mb-1.5 font-bold">Product Type</label><input type="text" name="product_type" defaultValue={editingProduct?.product_type || "Digital Download"} className="w-full bg-zinc-950 border border-white/15 rounded-xl p-3 text-white focus:outline-none focus:border-red-600" /></div>
                  </div>
                  <div className="grid grid-cols-3 gap-4">
                    <div><label className="text-zinc-400 block mb-1.5 font-bold">Price</label><input type="number" step="0.01" name="price" defaultValue={editingProduct?.price || 10} className="w-full bg-zinc-950 border border-white/15 rounded-xl p-3 text-white focus:outline-none focus:border-red-600" required /></div>
                    <div><label className="text-zinc-400 block mb-1.5 font-bold">Compare Price</label><input type="number" step="0.01" name="compare_price" defaultValue={editingProduct?.compare_price || 20} className="w-full bg-zinc-950 border border-white/15 rounded-xl p-3 text-white focus:outline-none focus:border-red-600" /></div>
                    <div><label className="text-zinc-400 block mb-1.5 font-bold">Stock</label><input type="number" name="stock" defaultValue={editingProduct?.stock || 50} className="w-full bg-zinc-950 border border-white/15 rounded-xl p-3 text-white focus:outline-none focus:border-red-600" required /></div>
                  </div>
                  <div><label className="text-zinc-400 block mb-1.5 font-bold">Image URL</label><input type="text" name="image_url" defaultValue={editingProduct?.image_url || ""} className="w-full bg-zinc-950 border border-white/15 rounded-xl p-3 text-white focus:outline-none focus:border-red-600" required /></div>
                  <div><label className="text-zinc-400 block mb-1.5 font-bold">Description</label><textarea name="description" defaultValue={editingProduct?.description || ""} className="w-full bg-zinc-950 border border-white/15 rounded-xl p-3 text-white h-24 focus:outline-none focus:border-red-600"></textarea></div>
                  <div className="flex gap-6 pt-2">
                    <label className="flex items-center gap-2 cursor-pointer text-white font-bold"><input type="checkbox" name="featured" defaultChecked={editingProduct?.featured || false} className="accent-red-600 w-4 h-4" /> Featured</label>
                    <label className="flex items-center gap-2 cursor-pointer text-white font-bold"><input type="checkbox" name="active" defaultChecked={editingProduct?.active ?? true} className="accent-red-600 w-4 h-4" /> Active</label>
                  </div>
                  <button type="submit" className="w-full py-4 bg-red-600 hover:bg-red-500 text-white font-extrabold rounded-xl shadow-[0_0_25px_rgba(255,0,60,0.5)] transition">SAVE PRODUCT TO DATABASE</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
